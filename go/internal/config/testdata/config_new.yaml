# DocVision Configuration（v10：models.<条目>.extends 命名基座 + 新 estimate 键）
# 配置样例：example_book 项目的一次运行配置，凭据与网关地址已替换为占位符；
# 供 runconfig_rewrite_test.go 钉住“声明式改写只动列出的键、其余逐字保留”。

config_version: 25

# MinerU API Configuration
mineru:
  api_base_url: "https://mineru.net/api/v4"
  token: "YOUR-MINERU-TOKEN-HERE"
  model_version: "vlm"         # pipeline, vlm, or MinerU-HTML
  is_ocr: true                 # 启用 OCR 以获得最佳效果
  enable_formula: true
  enable_table: true
  language: "ch"               # ch, en, japan, korean, etc.
  poll_interval: 3             # seconds between API polling attempts
  log_poll_interval: 3         # seconds between console log output
  poll_timeout: 0              # max seconds to wait for task completion (0 = unlimited)
  progress_threshold: 80       # 页数变化阈值，达到此值立即刷新输出
  max_pages_per_part: 200      # max pages per PDF part (MinerU limit)
  max_size_mb: 200             # max file size in MB per PDF part (MinerU limit)
  max_concurrent: 5            # 并发处理任务数
  upload_timeout: 1600         # 上传空闲超时秒数（有数据流动时不超时）

# 全局选项（img2text 专属配置见下方 img2text: 分组）
options:
  log_level: "info"        # info | debug | trace
                           #   debug: 请求参数/提示词/工具调用/响应统计/最终接收内容
                           #   trace: 再加流式分片进展行等细节

# Paths
paths:
  input_dir: "./files"              # dir with source files
  split_dir: "./split_files"        # dir for split PDF parts
  mineru_output: "./mineru_output"  # dir for MinerU API results
  output_dir: "./output"            # dir with merged .md files
  images_dir: "./output/images"
  finally_dir: "./finally"          # final output directory
  logs_dir: "./logs"                # img2text_*.log / latex_*.log
  done_dir: "./files/done"          # sources archived after a successful split
  latex_output: "./finally_latex"   # 档位2 LaTeX 输出目录
  latex_project: "./latex_project"  # 档位1 全书工作目录
  fonts: "./fonts"                  # 字体目录（用户手动放入；编译时经 TEXINPUTS/OSFONTDIR 生效）

# ----------------------------------------------------------------
# LaTeX output (docvision latex) —— 自带工作流：files/ 输入 → 自动前置 → 按档位处理 → 日志分析
# ----------------------------------------------------------------
latex:
  level: 1                       # 2 = per-image vectorisation; 1 = full-book LaTeX
  remove_watermark: false          # 水印处理：true 时提示各 AI 检测并排除水印（默认关闭）
  classifier_model: "classifier" # 图像分类 AI（text/vector/raster 标记）
  drawing_model: "drawing"       # TikZ 作图 AI（编译-核对-提交会话）
  style_model: "style"           # 档位1：全书样式分析 AI（cls+手册+案例）
  chapter_model: "chapter"       # 档位1：章节划分 AI（grep+最小bash沙箱）
  convert_model: "convert"       # 档位1：章节转换 / 构建修复 AI
  checker_model: "checker"       # 每章核对模型（会话调优未配置的字段继承 convert）
  insert_image_description: false # 档位2：raster 保留原图时是否再嵌入一段 AI 解释文本（档位1 总是带 DESCRIBE 解释块）
  chapter_granularity: "small"   # 档位1 章节拆分粒度：small=按小节拆分（默认）/ large=按大章整体拆分
  concurrency: 5                 # 会话级并发（重于 img2text，默认 3）
  keep_temp_dirs: false          # 保留临时工作目录（拆章沙箱/编译 scratch/矢量图工作区）；debug 日志下必定保留
  keep_session_records: false    # 保留会话转录 JSONL（成功会话默认清理）；debug 日志下必定保留
  compile:
    engine: "xelatex"            # pdflatex / xelatex / lualatex
    timeout: 120                 # 单次编译超时（秒）
    raster_command: "pdftoppm"   # PDF 栅格化工具（poppler-utils）
    raster_dpi: 180              # 矢量图 PDF 栅格化为 PNG 的分辨率（SVG 不可用时的回退产物）
    max_fix_rounds: 40            # 编译-修正整体循环上限
    final_review: true           # 全书编译通过后再跑一次终审会话（汇总/整理/重编译）
  sessions:
    drawing:
      context_limit: 131072      # 上下文窗口（tokens）
      max_tool_rounds: 128       # 0 = 真正不限制（无安全上限）
      max_tokens: 131072         # 单次请求最大输出（不含厂商单独计费的思维链预算）
      compaction_at: 0.85        # 达到窗口该比例时触发 AI 自动压缩（先本地裁剪，仍超才花 AI 摘要）
      tool_rounds_warn_ratio: 0.7 # 用满该比例的工具轮次后，每轮提醒还剩多少轮
      tool_rounds_grace: 20      # 到达 max_tool_rounds 后仍可用工具的额外轮次（负=无宽限）
      prune_tool_chars: 4096     # 本地裁剪：超过该长度的工具结果裁成"前半+后1/4"（负=不裁剪）
      keep_images: 3             # 本地裁剪时保留最近几张图（负=全保留）
    style:
      context_limit: 262144      # 样式分析建议更大窗口（256K）
      max_tool_rounds: 128
      max_tokens: 131072
    chapter:
      context_limit: 131072
      max_tool_rounds: 128
      max_tokens: 65536          # 开启思考时输出预算建议 ≥64K
    convert:
      context_limit: 131072
      max_tool_rounds: 128
      max_tokens: 65536
    checker:                     # 每章核对会话配置（未设置的字段继承 convert）
      max_tool_rounds: 50
      max_tokens: 8192           # 只回一小段 JSON 判定
  # 逐图校验（默认关闭）：矢量图重画完成后，再用一个能看图的模型把"重画图 ↔ 原图"
  # 比一遍；不一致就把问题打回同一个作图会话继续修，最多 max_rounds 轮。
  figure_check:
    enabled: false               # true = 逐图校验（每张图多一次视觉调用）
    model: "verifier"            # models: 里能看图的模型（缺条目时退回作图模型并在日志说明）
    max_rounds: 2                # 第 1 轮校验 + 最多这么多轮修正

# img2text 基础图片转文本流程的独立配置（模型用 models: 注册表代号）
# 上下文窗口/重试/mermaid 等工具参数统一在下方 tools: 中配置。
img2text:
  model: "text"                  # models: 中的条目名；留空用 models.text
  max_tokens: 65536
  temperature: 0.10
  concurrency: 10                # number of concurrent worker threads
  output_language: "Chinese"     # "Chinese" or "English"
  format_fix_attempts: 1         # 0=disable, 1=one retry for missing [IMG_TYPE:]

tools:
  view:                          # 看图软预算（只提醒，不拦截调用；按"对象"计数）
    image_max: 30                # 同一张图（文件）最多看 30 次（0=30，负=不限）
    pdf_max: 25                  # 同一个 PDF 的**每一页**最多看 25 次（0=25，负=不限）
    warn_ratio: 0.7              # 用满该比例起提醒"仅剩 N 次"（30*0.7=21，向上取整 → 第 21 次起）
  context:
    initial_up: 10
    initial_down: 5
    max_up: 50
    max_down: 50
    max_calls: 5
  mermaid:
    validation: "auto"           # off/auto/strict；auto 缺 mmdc 时警告并跳过
    command: "mmdc"
    fix_attempts: 3
    timeout: 30
  bash:                          # 会话 bash 工具（latex AI 会话用）
    sandbox: true                # 用 bubblewrap 内核沙箱（沙箱里只有本会话的挂载表；缺 bwrap 自动回退并告警）
    max_output: 5000             # bash 工具返回给模型的字符上限
  python:                       # 会话 bash 提供的 Python 环境（沙箱 --unshare-net 断网，会话自己装不了包）
    enabled: true               # 是否给会话 bash 提供 python3
    mode: "conda"              # system / venv / conda（venv 会按 env_dir 自动创建）
    interpreter: ""             # 解释器路径；留空=用 env_dir/bin/python3 或 PATH 里的 python3
    env_dir: ""                 # mode=venv：虚拟环境目录（不存在则宿主侧自动创建）；mode=conda：环境前缀
    conda_env: "base"               # mode=conda：环境名（env_dir 为空时用它解析前缀）
    pip_index_url: "https://pypi.tuna.tsinghua.edu.cn/simple"   # 宿主侧自动安装用的 PyPI 镜像（清华源；留空则用宿主 pip.conf）
    packages: []                # 启动前确保可导入的模块（如 ["numpy", "PIL"]；缺则宿主侧装）
    auto_install: true          # 会话 bash 报 ModuleNotFoundError 时由宿主侧自动 pip install 后提示重试
    install_timeout: 30000        # 单次 pip install 的超时（秒）

verify:
  enabled: false                 # 仅作提示：核对只在显式运行 docvision verify 时执行（自动流程不调用）
  verifier_model: "verifier"     # models: 中支持图像的校验模型
  concurrency: 2
  report_file: "verify_report.md"

# ----------------------------------------------------------------
# Named model registry — every specialised AI gets its own entry.
# Empty fields inherit the models.text default entry.
# thinking / reasoning_effort 是请求体顶层字段（不要写进 request_body.extra_body）
# ----------------------------------------------------------------
preview:
  enabled: false                 # true = 跑 docvision latex 时自动启动会话预览服务（只读，浏览器里看每个会话实时进度）
  host: "0.0.0.0"              # 监听地址；0.0.0.0 会让局域网内可访问（转录含全书内容，默认只本机）
  port: 8849                     # 端口；0 = 由内核挑一个空闲端口（启动日志里给出确切 URL）

# 本地 token 估算：只影响本地估算（上下文压缩阈值、会话预览页里带 ≈ 的数字）；
# 厂商回执的 prompt_tokens / completion_tokens 一律照抄，不受这里影响。
estimate:
  method: pixels                 # fixed / pixels / none；留空=pixels
  tokens: 1100                   # method=fixed 时每张的固定值；pixels 下取不到尺寸时也用它
  px_per_token: 750              # method=pixels：单张图片 token ≈ 宽×高 / 该值
  min_tokens: 85                 # method=pixels：单张下限
  max_tokens: 4096               # method=pixels：单张上限

models:
  text:                          # img2text 等基础流程使用的默认模型（必填）
    base_url: "https://api.example.com/v1"
    api_key: "sk-YOUR-API-KEY-HERE"
    model: "Qwen/Qwen3.5-27B"
    price:                       # 单价（元/百万 tokens，本条目自己的费率；其余条目不写 price 时继承这里）
      input: 0
      cached: 0                  # 前缀缓存命中的输入单价；不写则按 input 计
      output: 0
      currency: "¥"
    temperature: 1
    stream: true                 # 默认流式（SSE）；厂商不支持时自动回退一次非流式
    api_timeout: 600             # 非流式整次请求（连接+读取）总上限（秒）
    api_connect_timeout: 180      # 连接/首字节等待上限（秒）
    api_stream_idle_timeout: 0   # 流式：两个数据块之间最大间隔（秒），0 = 取 api_timeout
    api_max_retries: 5
    rate_limit_retries: 20        # 429 限流重试上限（退避封顶 60s；余额/配额类错误直接报错，不走重试）
    tool_stream: true
    thinking:
      type: disabled             # enabled | disabled（GLM-4.5+ / DeepSeek）
      clear_thinking: false
    request_body:
      enable_thinking: false     # Qwen 3.6+
  classifier:
    model: "Qwen/Qwen3.5-27B"    # 要求具备视觉能力
    price:                       # 单价（元/百万 tokens）；全 0 = 未配置，任何地方都不显示金额
      input: 0
      cached: 0                  # 前缀缓存命中的输入单价；不写则按 input 计
      output: 0
      currency: "¥"
  # ---- 命名基座：drawing / style / chapter / convert 四个角色原本逐字相同 ----
  # extends 在加载期按条目键深合并：本条目只写差异，没写的键取基座；
  # 覆盖判定看「键是否出现」，显式 0 / false / "" 也算覆盖，写 null 则清空该键。
  # 继承层级：heavy → text → 代码默认；换 key / 单价 / 思考设置时只改 heavy 这一条。
  heavy:
    model: "deepseek-v4.1-flash-expires-on-0910"   # 作图/样式/拆章/转换共用的重活模型
    price:                       # 单价（元/百万 tokens）；全 0 = 未配置，任何地方都不显示金额
      input: 0
      cached: 0                  # 前缀缓存命中的输入单价；不写则按 input 计
      output: 0
      currency: "¥"
    thinking:
      type: enabled            # 只能是 enabled | disabled | adaptive（写 disable 会被服务端 400 拒掉）
      clear_thinking: false    # 保留式思考：历史思维链完整回传（提升缓存命中）
    reasoning_effort: high       # max|xhigh|high|medium|low|minimal|none
  drawing:
    extends: "heavy"             # TikZ 作图 AI：编译-核对-提交会话
  style:
    extends: "heavy"             # 档位1：全书样式分析 AI（cls+手册+案例）
  chapter:
    extends: "heavy"             # 档位1：章节划分 AI（grep+最小 bash 沙箱）
  convert:
    extends: "heavy"             # 档位1：章节转换 / 构建修复 AI；只想改某一个角色时写在该角色条目下
  checker:                       # 每章核对（小文本模型即可）
    model: "Qwen/Qwen3.5-27B"
    price:                       # 单价（元/百万 tokens）；全 0 = 未配置，任何地方都不显示金额
      input: 0
      cached: 0                  # 前缀缓存命中的输入单价；不写则按 input 计
      output: 0
      currency: "¥"
  verifier:
    model: "glm-5.3-flash"       # AI 校验模型（需视觉能力）
    price:                       # 单价（元/百万 tokens）；全 0 = 未配置，任何地方都不显示金额
      input: 0
      cached: 0                  # 前缀缓存命中的输入单价；不写则按 input 计
      output: 0
      currency: "¥"
    temperature: 1               # GLM 推荐设置
    thinking:
      type: enabled              # GLM-5.3 强制思考，仅 enabled
      clear_thinking: false      # 保留式思考：历史思维链完整回传（提升缓存命中）
    tool_stream: true            # 工具参数随流返回
