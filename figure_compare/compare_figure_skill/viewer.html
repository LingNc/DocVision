<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare Figure Viewer</title>
<style>
:root{color-scheme:light;--ink:#20292f;--muted:#778187;--line:#dfe4e5;--paper:#fff;--teal:#087e75;--red:#a23a39}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.5 system-ui,sans-serif;background:#f8fafa}header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)}h1{margin:0;font-size:16px}.sub{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 52px)}aside{padding:16px;border-right:1px solid var(--line);background:#fff}main{min-width:0;padding:18px;max-width:1100px}.field{margin:0 0 14px}.field label{display:block;margin-bottom:4px;color:var(--muted);font-size:12px}.field input{max-width:100%}button,.file-button{display:inline-block;border:1px solid #b7cdca;border-radius:4px;background:#fff;color:var(--teal);padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}.button-row{display:flex;flex-wrap:wrap;gap:7px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.metric{padding:8px;border:1px solid var(--line);background:#fff;border-radius:4px}.metric span{display:block;color:var(--muted);font-size:10px}.metric b{font-size:15px}.status{font-weight:650}.status.pass{color:var(--teal)}.status.fail{color:var(--red)}.panel{margin:0 0 16px;border:1px solid var(--line);background:#fff}.panel-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}.panel-head strong{font-size:12px}.panel-stage{min-height:180px;max-height:70vh;overflow:auto;background:#17191a;padding:8px}.panel-stage img{display:block;max-width:none;image-rendering:pixelated}.empty{padding:36px;color:var(--muted);text-align:center}.note{color:var(--muted);font-size:11px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:12px}}
</style>
</head>
<body>
<header><h1>Compare Figure</h1><span class="sub">local result viewer</span></header>
<div class="layout"><aside>
<div class="field"><label for="metricsFile">metrics.json</label><input id="metricsFile" type="file" accept="application/json,.json"></div>
<div class="field"><label for="imageFiles">Review images (select multiple)</label><input id="imageFiles" type="file" accept="image/png,image/jpeg" multiple></div>
<div id="summary" class="empty">Choose a metrics file and review images.</div>
<div class="button-row"><button id="reset">Clear</button></div>
<p class="note">Files are read in this browser tab only. Nothing is uploaded.</p>
</aside><main id="panels"><div class="empty">No comparison results loaded.</div></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let urls=[];
function metric(label,value){return `<div class="metric"><span>${esc(label)}</span><b>${esc(value??"n/a")}</b></div>`}
function renderSummary(m){const pass=m.pass,channels=m.channel_similarity_percent||{};$("#summary").innerHTML=`<div class="status ${pass?"pass":"fail"}">${pass?"PASS":"REVIEW"}</div><div class="metrics">${metric("Similarity",`${m.similarity_percent??"n/a"}%`)}${metric("Threshold",`${m.threshold_percent??"n/a"}%`)}${Object.entries(channels).map(([k,v])=>metric(k.toUpperCase(),`${v}%`)).join("")}${metric("Translation",JSON.stringify(m.translation_px||{}))}</div><div class="note">${esc(m.score_method||"")}</div>${m.threshold_policy?`<pre>${esc(JSON.stringify(m.threshold_policy,null,2))}</pre>`:""}${m.worst_region?`<pre>Worst region: ${esc(JSON.stringify(m.worst_region))}</pre>`:""}`}
async function loadMetrics(file){const m=JSON.parse(await file.text());renderSummary(m);for(const u of urls)URL.revokeObjectURL(u);urls.length=0;const names=["candidate","montage","selected","gray","r","g","b"],chosen=new Map([...$("#imageFiles").files].map(f=>{const url=URL.createObjectURL(f);urls.push(url);return[f.name,url]}));const panels=[];for(const name of names){const url=chosen.get(`${name}.png`);if(url)panels.push(`<section class="panel"><div class="panel-head"><strong>${esc(name)}</strong></div><div class="panel-stage"><img src="${esc(url)}" alt="${esc(name)} comparison"></div></section>`)}$("#panels").innerHTML=panels.join("")||'<div class="empty">No matching review images selected. Choose PNG files from the output directory.</div>'}
$("#metricsFile").addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;try{await loadMetrics(file)}catch(err){$("#summary").textContent=`Could not read metrics: ${err.message||err}`}});$("#imageFiles").addEventListener("change",async()=>{const file=$("#metricsFile").files?.[0];if(file)await loadMetrics(file)});$("#reset").onclick=()=>{for(const u of urls)URL.revokeObjectURL(u);urls.length=0;$("#metricsFile").value="";$("#imageFiles").value="";$("#summary").innerHTML="";$("#panels").innerHTML='<div class="empty">No comparison results loaded.</div>'};
</script>
</body>
</html>
