name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fallback: build a release for any existing tag (e.g. a tag whose
  # push event was missed, or a tag created before this workflow could
  # publish pre-releases). Runs the workflow file from the branch it is
  # dispatched on, so an old tag can be published with the current logic:
  #   gh workflow run release.yml -f tag=v1.5.0-beta.4
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v1.5.0-beta.4）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # go.sum lives in go/, not at the repo root
          cache-dependency-path: go/go.sum

      - name: Run tests
        working-directory: go
        run: go test -v -race ./...

      - name: Set version
        run: echo "VERSION=${{ env.RELEASE_TAG }}" >> $GITHUB_ENV

      - name: Build release binaries
        working-directory: go
        run: make release VERSION=${{ env.VERSION }}

      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          # Extract the "## [<VERSION>]" section from CHANGELOG.md until the next "## [".
          # VERSION looks like v1.2.0; the brackets in awk regex need escaping.
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            {
              if (capture == 0 && $0 ~ "^## \\[" ver "\\]") { capture = 1; print; next }
              if (capture == 1 && $0 ~ "^## \\[") { capture = 0; next }
              if (capture == 1) { print }
            }
          ' CHANGELOG.md > /tmp/release_body.md
          if [ ! -s /tmp/release_body.md ]; then
            echo "::warning::No changelog section found for ${VERSION}; falling back to full CHANGELOG.md."
            cp CHANGELOG.md /tmp/release_body.md
          fi

      # Tags containing "-" (v1.5.0-beta.1, v0.1.2-rc1) publish as GitHub
      # *pre-releases*: binaries are built and attached exactly like a clean
      # tag, but the release is never marked Latest, so the stable line stays
      # authoritative. Clean tags (v1.5.0) publish as a normal release and are
      # explicitly marked Latest — GitHub otherwise badges whichever release
      # was published *last*, which once put "Latest" on v1.0.1 even though
      # v1.1.0 was newer.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Required for workflow_dispatch: the action otherwise reads the tag
          # from github.ref, which is refs/heads/master on a manual run and
          # fails with "GitHub Releases requires a tag".
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release_body.md
          files: go/release/*
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
