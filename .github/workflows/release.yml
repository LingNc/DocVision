name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fallback: build a release for any existing tag (e.g. when a tag
  # push event was missed). Run from the Actions tab, passing the tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v1.1.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Skip pre-release tags (e.g. v0.1.2-beta, v0.1.2-rc1).
    # Only clean version tags trigger a release.
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Run tests
        working-directory: go
        run: go test -v -race ./...

      - name: Set version
        run: echo "VERSION=${{ env.RELEASE_TAG }}" >> $GITHUB_ENV

      - name: Build release binaries
        working-directory: go
        run: make release VERSION=${{ env.VERSION }}

      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          # Extract the "## [<VERSION>]" section from CHANGELOG.md until the next "## [".
          # VERSION looks like v1.2.0; the brackets in awk regex need escaping.
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            {
              if (capture == 0 && $0 ~ "^## \\[" ver "\\]") { capture = 1; print; next }
              if (capture == 1 && $0 ~ "^## \\[") { capture = 0; next }
              if (capture == 1) { print }
            }
          ' CHANGELOG.md > /tmp/release_body.md
          if [ ! -s /tmp/release_body.md ]; then
            echo "::warning::No changelog section found for ${VERSION}; falling back to full CHANGELOG.md."
            cp CHANGELOG.md /tmp/release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_body.md
          files: go/release/*
          generate_release_notes: false
