name: Release

# 版本阶梯（RULE.md）：vX.Y.Z-dev.N（开发）→ vX.Y.Z-beta.N（最终非功能性
# 开发与修复）→ vX.Y.Z-alpha.N（收尾验证，几乎无问题）→ vX.Y.Z（正式版）。
#
# 自动发布：推 alpha 标签或正式版标签即构建并发布（正式版标 Latest，
# alpha 发预发布）。dev 与 beta 标签推送只做构建验证、**不发 release**——
# 需要发布时用 workflow_dispatch 手动选标签跑一次（P23）。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的标签（如 v1.6.0-beta.2）；留空 = 只验证当前分支构建"
        required: false
        default: ""
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # dispatch 未选标签时验证当前分支；选了标签就构建那个标签。
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # 推标签事件：dev / beta 不自动发布（alpha 与正式版发布）。
      AUTO_PUBLISH: ${{ github.event_name == 'push' && !contains(github.ref_name, '-dev') && !contains(github.ref_name, '-beta') }}
    steps:
      - name: Skip auto publish for dev/beta tags
        if: github.event_name == 'push' && !env.AUTO_PUBLISH
        run: |
          echo "标签 ${RELEASE_TAG} 属于 dev/beta 中间线：不自动发布。"
          echo "需要发布时到 Actions → Release → Run workflow 手动填入该标签。"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # go.sum lives in go/, not at the repo root
          cache-dependency-path: go/go.sum

      - name: Run tests
        working-directory: go
        run: go test -v -race ./...

      - name: Set version
        run: echo "VERSION=${{ env.RELEASE_TAG }}" >> $GITHUB_ENV

      - name: Build release binaries
        working-directory: go
        run: make release VERSION=${{ env.VERSION }}

      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          # Extract the "## [<VERSION>]" section from CHANGELOG.md until the next "## [".
          # VERSION looks like v1.2.0; the brackets in awk regex need escaping.
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            {
              if (capture == 0 && $0 ~ "^## \\[" ver "\\]") { capture = 1; print; next }
              if (capture == 1 && $0 ~ "^## \\[") { capture = 0; next }
              if (capture == 1) { print }
            }
          ' CHANGELOG.md > /tmp/release_body.md
          if [ ! -s /tmp/release_body.md ]; then
            echo "::warning::No changelog section found for ${VERSION}; falling back to full CHANGELOG.md."
            cp CHANGELOG.md /tmp/release_body.md
          fi

      # 含 "-" 的标签（alpha/beta/dev）发 GitHub *pre-release*：产物齐备但
      # 不标 Latest，正式版线始终权威；干净标签（v1.6.0）发正式 release 并
      # 显式标 Latest——GitHub 否则会把最近发布的 release 当 Latest。
      - name: Create GitHub Release
        # dispatch 只有明确填了 tag 才发布（空 tag = 仅构建验证）。
        if: env.AUTO_PUBLISH == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # Required for workflow_dispatch: the action otherwise reads the tag
          # from github.ref, which is refs/heads/master on a manual run and
          # fails with "GitHub Releases requires a tag".
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release_body.md
          files: go/release/*
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
