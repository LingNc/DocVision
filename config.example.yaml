# DocVision Configuration (example - copy to config.yaml and fill in your values)

config_version: 6

# MinerU API Configuration
mineru:
  api_base_url: "https://mineru.net/api/v4"
  token: "YOUR-MINERU-TOKEN-HERE"
  model_version: "vlm"         # pipeline, vlm, or MinerU-HTML
  is_ocr: true                 # 启用 OCR 以获得最佳效果
  enable_formula: true
  enable_table: true
  language: "ch"               # ch, en, japan, korean, etc.
  poll_interval: 3             # seconds between API polling attempts
  log_poll_interval: 3         # seconds between console log output (exponential backoff starts here)
  poll_timeout: 0              # max seconds to wait for task completion (0 = unlimited)
  progress_threshold: 80       # 页数变化阈值，达到此值立即刷新输出
  max_pages_per_part: 200      # max pages per PDF part (MinerU limit)
  max_size_mb: 200             # max file size in MB per PDF part (MinerU limit)
  max_concurrent: 5            # 并发处理任务数
  upload_timeout: 300          # 上传空闲超时秒数（有数据流动时不超时）

# AI 模型统一在下方 models: 注册表配置（旧版顶层 ai: 块仍兼容，新配置不必写）。

# Processing options
options:
  # Recommended: npm install -g @mermaid-js/mermaid-cli (provides mmdc).
  # init only creates this config; it does not install Node.js/npm, but it
  # will prompt for permission to run npm install -g @mermaid-js/mermaid-cli
  # before any installation happens.
  log_level: "info"                 # info | debug | trace（debug 记请求响应/提示词/工具调用/最终内容，trace 再加流式分片）
# Paths
paths:
  input_dir: "./files"              # dir with source files
  split_dir: "./split_files"        # dir for split PDF parts
  mineru_output: "./mineru_output"  # dir for MinerU API results
  output_dir: "./output"            # dir with merged .md files
  images_dir: "./output/images"
  finally_dir: "./finally"          # final output directory
  logs_dir: "./logs"                # img2text_*.log / img2text_error_*.log
  done_dir: "./files/done"          # dir for sources archived after a successful split
  latex_output:  ./finally_latex    # 档位2 LaTeX 输出目录
  latex_project: ./latex_project    # 档位1 全书工作目录
  fonts:        ./fonts             # AI 字体目录（可自动下载字体）

# ----------------------------------------------------------------
# LaTeX output (docvision latex)
# ----------------------------------------------------------------
latex:
  level: 2                       # 2 = per-image vectorisation; 1 = full-book LaTeX
  remove_watermark: false        # 水印处理：true 时提示各 AI 检测并排除水印（默认关闭，水印原样保留）
  # Model registry keys for each specialised AI session.
  # Each key must exist in the models: registry below; entries there
  # may declare their own base_url / api_key / model / request_body
  # (empty fields inherit the models.text default entry).
  classifier_model: "classifier" # 图像分类 AI（text/vector/raster 标记）
  drawing_model: "drawing"       # TikZ 作图 AI（编译-核对-提交会话）
  style_model: "style"           # 档位1：全书样式分析 AI（cls+手册+案例）
  chapter_model: "chapter"       # 档位1：章节划分 AI（grep+最小bash沙箱）
  convert_model: "convert"       # 档位1：章节转换 / 构建修复 AI
  checker_model: "checker"
  insert_image_description: false # raster 保留原图时是否嵌入 AI 解释文本
                                 # （同时控制 vector 确认后嵌入 tikz 代码块而非 PDF 链接）
  chapter_granularity: "small"   # 档位1 章节拆分粒度：small=按小节拆分（默认）/ large=按大章整体拆分
  concurrency: 3                 # 会话级并发（重于 img2text，默认 3）
  keep_temp_dirs: false       # 保留临时工作目录（拆章沙箱/编译 scratch/矢量图工作区）；debug 日志下必定保留
  keep_session_records: false # 保留会话转录 JSONL（成功会话默认清理）；debug 日志下必定保留
  bash_sandbox: true          # 会话 bash 是否用 bubblewrap 内核沙箱（只挂载本会话的挂载表）
  bash_max_output: 5000          # 会话 bash 工具返回给模型的字符上限（默认 5000）
  compile:
    engine: "xelatex"            # pdflatex / xelatex / lualatex
    timeout: 120                 # 单次编译超时（秒）
    raster_command: "pdftoppm"   # PDF 栅格化工具（poppler-utils）
    raster_dpi: 220              # 回给 AI 核对的 PNG 分辨率
    max_fix_rounds: 40           # 编译-修正整体循环上限
    final_review: true           # 全书编译通过后再跑一次终审会话（汇总/整理/重编译）
  sessions:                      # 每个 AI 会话的独立调优
    drawing:
      context_limit: 131072      # 上下文窗口（tokens，默认 128K，可改 64K/256K 等）
      max_tool_rounds: 128       # 0 = 真正不限制（无安全上限）
      max_tokens: 131072
      compaction_at: 0.85        # 达到窗口该比例时触发 AI 自动压缩
    style:
      context_limit: 262144      # 样式分析建议更大窗口（256K）
      max_tool_rounds: 128       # 0 = 真正不限制（无安全上限）
      max_tokens: 131072
    chapter:
      context_limit: 131072
      max_tool_rounds: 128       # 0 = 真正不限制（无安全上限）
    convert:
      context_limit: 131072
      max_tool_rounds: 128       # 0 = 真正不限制（无安全上限）
    checker:                     # 每章核对会话配置（未设置的字段继承 convert 块）

# img2text 基础图片转文本流程的独立配置（模型用 models: 注册表代号）
img2text:
  # ---- 以下由原 options: 块迁移（仅作用于 img2text 流程） ----
  concurrency: 10                # number of concurrent worker threads
  temperature: 0.10
  output_language: "Chinese"     # "Chinese" or "English"
  format_fix_attempts: 1         # 0=disable, 1=one retry for missing [IMG_TYPE:]
  max_tokens: 65536
  model: "text"                  # models: 中的条目名；留空用 models.text
  # max_tokens: 65536            # 覆盖 options.max_tokens
  # temperature: 0.10
  # request_body:                # 覆盖请求体参数

# AI verification（AI 校验：默认关闭，先上日程）
# ----------------------------------------------------------------
# ----------------------------------------------------------------
# Tools - per-tool tunables shared by every pipeline (img2text context
# expansion, latex image_context, mermaid/tikz validation).
# ----------------------------------------------------------------
tools:
  context:
    initial_up: 10              # initial context lines above the image
    initial_down: 5             # initial context lines below the image
    max_up: 50                  # expansion cap above (lines)
    max_down: 50                # expansion cap below (lines)
    max_calls: 5                # max expansion requests per image
  mermaid:
    validation: "auto"          # off, auto, strict; auto warns and skips if mmdc is missing
    command: "mmdc"             # Mermaid CLI command
    fix_attempts: 3             # Mermaid-only repair attempts (0 = unlimited, capped by safety limit)
    timeout: 30                 # Mermaid validation timeout in seconds
  latex:
    validation: "auto"          # off, auto, strict; latex code blocks are compile-checked
    engine: "xelatex"           # latex validation engine (pdflatex/lualatex fallback)
verify:
  enabled: false                 # 默认关闭；开启后自动流程核对每张图与内容
  verifier_model: "verifier"     # models: 中支持图像的校验模型
  concurrency: 2
  report_file: "verify_report.md"

# ----------------------------------------------------------------
# Named model registry — every specialised AI gets its own entry.
# Empty fields (base_url/api_key/model/request_body) inherit the
# top-level ai block, so a minimal setup only sets model:.
# ----------------------------------------------------------------
models:
  text:                        # img2text 等基础流程使用的默认模型（必填；其他条目留空字段继承这里）
    base_url: "https://your-api-proxy.com/v1"
    api_key: "sk-YOUR-API-KEY-HERE"
    model: "Qwen/Qwen3.6-27B"
    temperature: 0.10
    # API 请求控制（全局默认；各 models 条目可单独覆盖）
    api_timeout: 400            # 非流式：整次请求（连接+读取）总上限（秒）
    api_connect_timeout: 60     # 连接/首字节等待上限（秒）
    api_stream_idle_timeout: 0  # 流式：两个数据块之间的最大间隔（秒），0 = 用 api_timeout
    api_max_retries: 3          # API retry count for non-rate-limit errors
    rate_limit_retries: 100     # 429 限流重试上限（原代码内安全上限值）
    stream: true                # 默认流式（SSE）：长思考/长输出期间持续有进展，不再静默等待
    # 思考（思维链）控制：顶层字段，不要写进 request_body.extra_body
    thinking:
      type: disabled            # enabled | disabled（GLM-4.5+ / DeepSeek）
    # reasoning_effort: high    # 思考强度 max|xhigh|high|medium|low|minimal|none（GLM-5.2+，thinking 开启时生效）
    request_body:               # 其它厂商参数（原样合并进请求体顶层）
      enable_thinking: false    # Qwen 3.6+
  classifier:
    model: "Qwen/Qwen3.6-27B"    # 要求具备视觉能力
  drawing:
    model: "glm-5.3-flash"       # 作图 AI：需强视觉+代码能力
    # base_url: "https://other-provider.example/v1"   # 可单独指定
    # api_key: "sk-..."
    # stream: false                                  # 该模型单独关闭流式
    # thinking: { type: enabled, clear_thinking: false }  # 单独开启思考；clear_thinking:false=保留式思考（GLM，提升缓存命中）
    # tool_stream: true                               # GLM 工具流式输出（stream:true 时随流返回工具参数）
    # reasoning_effort: high
    thinking:
      type: enabled
  style:
    model: "glm-5.3-flash"
    thinking:
      type: enabled
  chapter:
    model: "glm-5.3-flash"
  convert:
    model: "glm-5.3-flash"
  checker:                       # 每章核对（小文本模型即可）
    model: "Qwen/Qwen3.6-27B"
  verifier:
    model: "glm-5.3-flash"       # AI 校验模型（需视觉能力）
